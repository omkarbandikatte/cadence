<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cadence system architecture</title>
  <desc id="desc">Six-stage recovery loop from failed debit ingestion through classification, prediction, policy, compliance gate, execution, and append-only ledger feedback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .stage { stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="title">Cadence recovery architecture</text>
  <text x="600" y="82" text-anchor="middle" class="body">Deterministic decisions, compliance-controlled actions, and an auditable feedback loop</text>

  <rect x="60" y="125" width="200" height="105" class="stage" fill="#e0f2fe"/>
  <text x="160" y="157" text-anchor="middle" class="label">1. Ingest</text>
  <text x="160" y="184" text-anchor="middle" class="body">Webhooks or replay</text>
  <text x="160" y="205" text-anchor="middle" class="body">FailureEvent</text>

  <rect x="295" y="125" width="200" height="105" class="stage" fill="#fef3c7"/>
  <text x="395" y="157" text-anchor="middle" class="label">2. Classify</text>
  <text x="395" y="184" text-anchor="middle" class="body">Taxonomy rules</text>
  <text x="395" y="205" text-anchor="middle" class="body">Root cause + confidence</text>

  <rect x="530" y="125" width="200" height="105" class="stage" fill="#dcfce7"/>
  <text x="630" y="157" text-anchor="middle" class="label">3. Predict</text>
  <text x="630" y="184" text-anchor="middle" class="body">Funding-window model</text>
  <text x="630" y="205" text-anchor="middle" class="body">Best day + probability</text>

  <rect x="765" y="125" width="200" height="105" class="stage" fill="#fce7f3"/>
  <text x="865" y="157" text-anchor="middle" class="label">4. Policy</text>
  <text x="865" y="184" text-anchor="middle" class="body">Decision table</text>
  <text x="865" y="205" text-anchor="middle" class="body">Proposed action</text>

  <path d="M260 177 H295 M495 177 H530 M730 177 H765" class="line"/>

  <rect x="350" y="330" width="500" height="135" class="stage" fill="#ffedd5" stroke="#ea580c"/>
  <text x="600" y="365" text-anchor="middle" class="label">5. Compliance gate</text>
  <text x="600" y="393" text-anchor="middle" class="body">Re-evaluates the action at execution time</text>
  <text x="600" y="416" text-anchor="middle" class="body">Allowed -> execute   |   Blocked -> ledger and stop</text>
  <text x="600" y="443" text-anchor="middle" class="small">Single choke point for presentments, messages, links, and re-authentication</text>

  <path d="M865 230 V275 H600 V330" class="line"/>

  <rect x="125" y="560" width="270" height="105" class="stage" fill="#ede9fe"/>
  <text x="260" y="592" text-anchor="middle" class="label">6. Execute</text>
  <text x="260" y="619" text-anchor="middle" class="body">Presentment, message, link</text>
  <text x="260" y="640" text-anchor="middle" class="body">or re-authentication</text>

  <rect x="465" y="560" width="270" height="105" class="stage" fill="#ccfbf1"/>
  <text x="600" y="592" text-anchor="middle" class="label">Append-only ledger</text>
  <text x="600" y="619" text-anchor="middle" class="body">Decisions, blocks, actions</text>
  <text x="600" y="640" text-anchor="middle" class="body">and outcomes</text>

  <rect x="805" y="560" width="270" height="105" class="stage" fill="#e2e8f0"/>
  <text x="940" y="592" text-anchor="middle" class="label">Adapters</text>
  <text x="940" y="619" text-anchor="middle" class="body">Live APIs or simulator</text>
  <text x="940" y="640" text-anchor="middle" class="body">Same core logic in both modes</text>

  <path d="M600 465 V560" class="line"/>
  <path d="M350 397 H260 V560" class="line"/>
  <path d="M395 612 H465 M735 612 H805" class="line"/>
  <path d="M735 665 V710 H940 V665" class="feedback"/>
  <path d="M465 710 H80 V275 H630 V230" class="feedback"/>
  <text x="100" y="735" class="small" fill="#0f766e">Ledger outcomes feed customer history and the next prediction</text>

  <text x="875" y="300" text-anchor="middle" class="small">All stages write an auditable record</text>
</svg>